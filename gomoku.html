<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>五 子 棋</h1>

        <div class="mode-toggle">
            <button id="btnPvP" class="active" onclick="setMode('pvp')">双人对战</button>
            <button id="btnPvE" onclick="setMode('pve')">人机对战</button>
        </div>

        <div class="info-bar">
            <div class="score-board">
                <div>⚫ 黑棋: <span id="scoreB">0</span></div>
                <div>⚪ 白棋: <span id="scoreW">0</span></div>
            </div>
            <div class="turn-indicator">
                <div class="turn-stone black" id="turnStone"></div>
                <div class="status" id="status">黑棋落子</div>
            </div>
        </div>

        <div class="board-wrapper">
            <canvas id="board"></canvas>
        </div>

        <div class="btn-group">
            <button onclick="undoMove()">悔 棋</button>
            <button onclick="restart()">重新开始</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
